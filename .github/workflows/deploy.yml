name: Deploy MAALAL CARS (VPS SSH CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Ignorer les tests (deploiement d'urgence)"
        required: false
        type: boolean
        default: false

concurrency:
  group: production_deployment
  cancel-in-progress: false

env:
  DATABASE_URL: "file:./dev.db"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality-gates:
    name: Quality Gates & Tests
    runs-on: ubuntu-latest
    if: inputs.skip_tests != true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate dynamic session secret
        run: |
          DYNAMIC_SECRET="${{ secrets.SESSION_SECRET }}"
          if [ -z "$DYNAMIC_SECRET" ]; then
            DYNAMIC_SECRET=$(openssl rand -hex 32)
          fi
          echo "SESSION_SECRET=$DYNAMIC_SECRET" >> $GITHUB_ENV

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Init SQLite for tests
        run: npx prisma db push --skip-generate

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    needs: [quality-gates]
    if: always() && (needs.quality-gates.result == 'success' || inputs.skip_tests == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate dynamic session secret
        run: |
          DYNAMIC_SECRET="${{ secrets.SESSION_SECRET }}"
          if [ -z "$DYNAMIC_SECRET" ]; then
            DYNAMIC_SECRET=$(openssl rand -hex 32)
          fi
          echo "SESSION_SECRET=$DYNAMIC_SECRET" >> $GITHUB_ENV

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (linux)
        run: npx prisma generate

      - name: Build Next.js standalone
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Prepare standalone artifact
        run: |
          mkdir -p .next/standalone/.next/static
          mkdir -p .next/standalone/public
          mkdir -p .next/standalone/prisma

          # Static assets
          cp -r .next/static/* .next/standalone/.next/static/

          # Public folder
          cp -r public/* .next/standalone/public/

          # Prisma schema & scripts
          cp prisma/schema.prisma .next/standalone/prisma/
          cp prisma/ensure-admin.sql .next/standalone/prisma/ 2>/dev/null || true
          cp prisma/production.template .next/standalone/prisma/ 2>/dev/null || true

          # Prisma engines (runtime query engine for the app)
          mkdir -p .next/standalone/node_modules
          cp -r node_modules/.prisma .next/standalone/node_modules/ 2>/dev/null || true
          cp -r node_modules/@prisma .next/standalone/node_modules/ 2>/dev/null || true
          chmod +x .next/standalone/node_modules/.prisma/client/query-engine* 2>/dev/null || true

          # Generate SQL init script for first-deploy DB creation
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > .next/standalone/prisma/init.sql

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload build to VPS
        run: |
          tar czf /tmp/release.tar.gz -C .next/standalone .
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -P ${{ secrets.VPS_PORT }} /tmp/release.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/release.tar.gz

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            RELEASE_DIR="/var/www/maalalcars/releases/$(date +%Y%m%d_%H%M%S)"
            mkdir -p ${RELEASE_DIR}

            # Extract release
            tar xzf /tmp/release.tar.gz -C ${RELEASE_DIR}
            rm /tmp/release.tar.gz

            # Symlink shared storage into release
            mkdir -p /var/www/maalalcars/shared/storage
            ln -sfn /var/www/maalalcars/shared/storage ${RELEASE_DIR}/storage
            ln -sfn /var/www/maalalcars/shared/storage ${RELEASE_DIR}/public/storage

            # Symlink shared database
            mkdir -p /var/www/maalalcars/shared/prisma
            ln -sfn /var/www/maalalcars/shared/prisma/production.db ${RELEASE_DIR}/prisma/dev.db

            # If production.db doesn't exist OR has 0 vehicles, restore from production.template!
            VEHICLE_COUNT=$(sqlite3 /var/www/maalalcars/shared/prisma/production.db "SELECT count(*) FROM Vehicle;" 2>/dev/null || echo 0)
            if [ ! -f /var/www/maalalcars/shared/prisma/production.db ] || [ "$VEHICLE_COUNT" -eq 0 ]; then
              if [ -f ${RELEASE_DIR}/prisma/production.template ]; then
                echo "Restoring complete database with vehicles from production.template..."
                cp ${RELEASE_DIR}/prisma/production.template /var/www/maalalcars/shared/prisma/production.db
                chmod 664 /var/www/maalalcars/shared/prisma/production.db
              else
                sqlite3 /var/www/maalalcars/shared/prisma/production.db < ${RELEASE_DIR}/prisma/init.sql
                echo "Database initialized via init.sql"
              fi
            fi

            # Ensure schema updates and Admin user exist
            if [ -f ${RELEASE_DIR}/prisma/ensure-admin.sql ]; then
              sqlite3 /var/www/maalalcars/shared/prisma/production.db < ${RELEASE_DIR}/prisma/ensure-admin.sql 2>/dev/null || true
              echo "Admin user and schema verified via ensure-admin.sql"
            fi

            # Symlink .env.production
            if [ -f /var/www/maalalcars/shared/.env.production ]; then
              ln -sfn /var/www/maalalcars/shared/.env.production ${RELEASE_DIR}/.env.production
            fi

            # Switch current symlink to new release
            ln -sfn ${RELEASE_DIR} /var/www/maalalcars/current

            # Restart app via PM2
            cd /var/www/maalalcars/current
            pm2 delete maalalcars 2>/dev/null || true
            PORT=3000 NODE_ENV=production DATABASE_URL="file:/var/www/maalalcars/shared/prisma/production.db" pm2 start server.js --name maalalcars --cwd /var/www/maalalcars/current
            pm2 save

            # Keep only last 5 releases
            cd /var/www/maalalcars/releases
            ls -dt */ | tail -n +6 | xargs rm -rf 2>/dev/null || true

            echo "Deployment complete: ${RELEASE_DIR}"
          ENDSSH
