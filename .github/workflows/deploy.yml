name: Deploy MAALAL CARS (Shared Hosting FTP CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Ignorer les tests (déploiement d’urgence)"
        required: false
        type: boolean
        default: false

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  quality-gates:
    name: 🛡️ Quality Gates & Tests
    runs-on: ubuntu-latest
    if: inputs.skip_tests != true
    steps:
      - name: 📥 Checkout du Code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Installation Dépendances
        run: npm ci

      - name: 🔍 Génération Client Prisma
        run: npx prisma generate

      - name: 🧪 Vérification Statique TypeScript
        run: npm run typecheck

      - name: 🧹 Vérification Lint ESLint
        run: npm run lint

      - name: 🚦 Exécution Suite de Tests Vitest (80 tests)
        run: npm run test

  build-and-deploy:
    name: 🚀 Build Standalone & Déploiement FTP Mutualisé
    runs-on: ubuntu-latest
    needs: [quality-gates]
    if: always() && (needs.quality-gates.result == 'success' || inputs.skip_tests == true)
    steps:
      - name: 📥 Checkout du Code
        uses: actions/checkout@v4

      - name: ⚙️ Configuration Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Installation Dépendances
        run: npm ci

      - name: 🔨 Génération Client Prisma Linux
        run: npx prisma generate

      # Si une URL de base de données distante est configurée dans les secrets GitHub (ex: MySQL cPanel ou Neon/Supabase),
      # GitHub Actions applique directement les migrations de schéma avant l'envoi des fichiers
      - name: 🗄️ Application du Schéma Prisma (Optionnel si PROD_DATABASE_URL est défini)
        if: env.PROD_DATABASE_URL != ''
        run: npx prisma db push --skip-generate
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: 🏗️ Compilation Next.js Standalone
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: 📦 Assemblage de l'Artefact Standalone & Adaptateur Passenger
        run: |
          echo "Assemblage des assets statiques, schéma Prisma et déclencheur de redémarrage..."
          mkdir -p .next/standalone/.next/static
          mkdir -p .next/standalone/public
          mkdir -p .next/standalone/prisma
          mkdir -p .next/standalone/tmp
          mkdir -p .next/standalone/scripts

          # Copie des fichiers statiques compilés (CSS, JS, fonts)
          cp -r .next/static/* .next/standalone/.next/static/

          # Copie du dossier public (images, roue Michelin, logos)
          cp -r public/* .next/standalone/public/

          # Copie du schéma Prisma et des migrations
          cp -r prisma/* .next/standalone/prisma/

          # Copie du package.json
          cp package.json .next/standalone/

          # Copie explicite des moteurs Prisma (.prisma / @prisma)
          mkdir -p .next/standalone/node_modules
          cp -r node_modules/.prisma .next/standalone/node_modules/ 2>/dev/null || true
          cp -r node_modules/@prisma .next/standalone/node_modules/ 2>/dev/null || true

          # Script de migration manuel exécutable depuis l'interface cPanel "Run JS Script"
          cat << 'EOF' > .next/standalone/scripts/migrate.js
          const { execSync } = require('child_process');
          try {
            console.log('Exécution de prisma db push...');
            execSync('npx prisma db push --skip-generate', { stdio: 'inherit' });
            console.log('Mise à jour de la base de données réussie.');
          } catch (e) {
            console.error('Erreur migration:', e.message);
          }
          EOF

          # Copie du template SQLite de production avec toutes les tables déjà prêtes
          cp prisma/production.template .next/standalone/prisma/production.template
          cp prisma/production.template .next/standalone/prisma/production.init.template
          cp prisma/production.template .next/standalone/production.init.template

          # Déclencheur Phusion Passenger : horodate unique pour forcer le hot-reload au transfert FTP
          date +%s > .next/standalone/tmp/restart.txt

          # Copie des scripts de diagnostic et maintenance
          mkdir -p .next/standalone/scripts
          cp scripts/diagnose.js .next/standalone/scripts/diagnose.js

          # Point d'entrée Phusion Passenger pour cPanel avec traçage temps réel et route /__debug
          cat << 'EOF' > .next/standalone/app.js
          // Point d'entrée Phusion Passenger / cPanel Node.js avec traçage temps réel
          process.env.NODE_ENV = process.env.NODE_ENV || 'production';

          const fs = require('fs');
          const path = require('path');
          const http = require('http');

          const debugLog = path.join(__dirname, 'debug.log');
          function log(msg) {
            const line = `[${new Date().toISOString()}] ${msg}\n`;
            try { fs.appendFileSync(debugLog, line); } catch (_) {}
            console.log(msg);
          }

          log('====================================================');
          log('🚀 [MAALAL CARS] app.js DÉMARRAGE DU PROCESSUS');
          log('Node.js: ' + process.version + ' | CWD: ' + process.cwd() + ' | __dirname: ' + __dirname);

          process.on('uncaughtException', (err) => {
            log('💥 [EXCEPTION NON GÉRÉE] ' + (err && err.stack ? err.stack : err));
          });
          process.on('unhandledRejection', (reason) => {
            log('💥 [REJECTION NON GÉRÉE] ' + (reason && reason.stack ? reason.stack : reason));
          });

          // Interception HTTP pour route de secours /__debug
          try {
            const origCreateServer = http.createServer;
            http.createServer = function(...args) {
              log('🌐 [HTTP] http.createServer intercepté avec succès');
              const origHandler = args[args.length - 1];
              if (typeof origHandler === 'function') {
                args[args.length - 1] = function(req, res) {
                  if (req.url === '/__debug' || req.url === '/api/diagnostic') {
                    res.writeHead(200, { 'Content-Type': 'text/plain; charset=utf-8' });
                    try {
                      const content = fs.readFileSync(debugLog, 'utf8');
                      return res.end(content);
                    } catch (e) {
                      return res.end('Fichier debug.log introuvable : ' + e.message);
                    }
                  }
                  return origHandler.call(this, req, res);
                };
              }
              return origCreateServer.apply(this, args);
            };
          } catch (e) {
            log('⚠️ Note interception HTTP : ' + e.message);
          }

          // 1. Charge les variables d'environnement depuis .env.production ou .env si présent
          try {
            const envFiles = ['.env.production', '.env.local', '.env'];
            for (const file of envFiles) {
              const fullPath = path.join(__dirname, file);
              if (fs.existsSync(fullPath)) {
                const content = fs.readFileSync(fullPath, 'utf8');
                content.split(/\r?\n/).forEach((line) => {
                  const trimmed = line.trim();
                  if (trimmed && !trimmed.startsWith('#') && trimmed.includes('=')) {
                    const idx = trimmed.indexOf('=');
                    const key = trimmed.slice(0, idx).trim();
                    let val = trimmed.slice(idx + 1).trim();
                    if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                      val = val.slice(1, -1);
                    }
                    if (!process.env[key]) {
                      process.env[key] = val;
                    }
                  }
                });
                log('📄 Variables chargées depuis ' + file);
              }
            }
          } catch (e) {
            log('⚠️ Note lecture .env : ' + e.message);
          }

          // 2. Définir et exporter explicitement DATABASE_URL vers maalalcars/prisma/production.db
          let targetDb = '';
          if (process.env.DATABASE_URL && process.env.DATABASE_URL.startsWith('file:')) {
            targetDb = process.env.DATABASE_URL.replace(/^file:/, '');
          } else {
            targetDb = path.join(__dirname, 'prisma', 'production.db');
            process.env.DATABASE_URL = 'file:' + targetDb;
          }
          log('🗄️ DATABASE_URL = ' + process.env.DATABASE_URL);

          // 3. Auto-initialisation SQLite instantanée par copie du template
          try {
            const candidates = [
              path.join(__dirname, 'prisma', 'production.init.template'),
              path.join(__dirname, 'prisma', 'production.template'),
              path.join(__dirname, 'production.init.template'),
              path.join(__dirname, 'production.template'),
              path.join(__dirname, 'maalalcars', 'prisma', 'production.template'),
            ];
            const templateDb = candidates.find((f) => fs.existsSync(f));
            log('🔍 Recherche template : ' + (templateDb ? templateDb : 'AUCUN'));

            const stat = fs.existsSync(targetDb) ? fs.statSync(targetDb) : null;
            log('📊 Statut ' + targetDb + ' : ' + (stat ? stat.size + ' octets' : 'INEXISTANT'));

            if (!stat || stat.size < 100000) {
              if (templateDb) {
                fs.mkdirSync(path.dirname(targetDb), { recursive: true });
                try { fs.unlinkSync(targetDb); } catch (_) {}
                fs.copyFileSync(templateDb, targetDb);
                const newStat = fs.statSync(targetDb);
                log('✅ Base de données initialisée depuis ' + templateDb + ' (' + newStat.size + ' octets)');
              } else {
                log('❌ AVERTISSEMENT : Aucun template DB trouvé parmi les candidats');
              }
            }
            if (fs.existsSync(targetDb)) {
              try { fs.chmodSync(targetDb, 0o666); } catch (_) {}
              try { fs.chmodSync(path.dirname(targetDb), 0o777); } catch (_) {}
            }
          } catch (e) {
            log('⚠️ Erreur init SQLite : ' + e.message);
          }

          // 4. Démarrage du serveur Next.js
          log('⏳ Chargement de ./server.js...');
          require('./server.js');
          log('✅ ./server.js requis sans erreur synchrone');
          EOF

          # Dupliquer app.js en App.js au cas où cPanel a été configuré avec une majuscule
          cp .next/standalone/app.js .next/standalone/App.js

          # Injecter un log trace au début de server.js au cas où Passenger appelle server.js directement
          node -e '
            const fs = require("fs");
            const p = ".next/standalone/server.js";
            const c = fs.readFileSync(p, "utf8");
            const trace = "try{require(\"fs\").appendFileSync(require(\"path\").join(__dirname,\"debug.log\"),\"[\"+new Date().toISOString()+\"] ⚡ SERVER.JS EXECUTION\\n\");}catch(_){}\n";
            fs.writeFileSync(p, trace + c);
          '

          # Mettre à jour package.json standalone avec scripts start et diagnose
          node -e '
            const fs = require("fs");
            const p = ".next/standalone/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.scripts = pkg.scripts || {};
            pkg.scripts.start = "node app.js";
            pkg.scripts.diagnose = "node scripts/diagnose.js";
            fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
          '

      # DÉPLOIEMENT INCRÉMENTAL VIA FTP / FTPS (Toujours à la racine ./ du compte FTP)
      - name: 🚀 Déploiement Incrémental via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          local-dir: .next/standalone/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.env*
            **/data/**
            **/storage/**
            **/*.db
            **/*.db-journal*
            **/*.db-wal*
            **/*.db-shm*
            **/node_modules/.cache/**
