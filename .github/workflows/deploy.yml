name: Deploy MAALAL CARS (VPS SSH CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Ignorer les tests (deploiement d'urgence)"
        required: false
        type: boolean
        default: false

concurrency:
  group: production_deployment
  cancel-in-progress: false

env:
  DATABASE_URL: "file:./dev.db"
  SESSION_SECRET: "ci-secret-must-be-at-least-32-characters-long"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality-gates:
    name: Quality Gates & Tests
    runs-on: ubuntu-latest
    if: inputs.skip_tests != true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Init SQLite for tests
        run: npx prisma db push --skip-generate

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Run tests
        run: npm run test

  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    needs: [quality-gates]
    if: always() && (needs.quality-gates.result == 'success' || inputs.skip_tests == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (linux)
        run: npx prisma generate

      - name: Build Next.js standalone
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Prepare standalone artifact
        run: |
          mkdir -p .next/standalone/.next/static
          mkdir -p .next/standalone/public
          mkdir -p .next/standalone/prisma

          # Static assets
          cp -r .next/static/* .next/standalone/.next/static/

          # Public folder
          cp -r public/* .next/standalone/public/

          # Prisma schema
          cp prisma/schema.prisma .next/standalone/prisma/

          # Prisma engines
          mkdir -p .next/standalone/node_modules
          cp -r node_modules/.prisma .next/standalone/node_modules/ 2>/dev/null || true
          cp -r node_modules/@prisma .next/standalone/node_modules/ 2>/dev/null || true
          chmod +x .next/standalone/node_modules/.prisma/client/query-engine* 2>/dev/null || true

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          # Verify key is readable
          ssh-keygen -l -f ~/.ssh/deploy_key || (echo "SSH key format error - check VPS_SSH_KEY secret" && exit 1)

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          RELEASE_DIR="/var/www/maalalcars/releases/$(date +%Y%m%d_%H%M%S)"
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST}"
          SCP_CMD="scp -i ~/.ssh/deploy_key -P ${VPS_PORT} -o StrictHostKeyChecking=no"

          # Create release directory
          ${SSH_CMD} "mkdir -p ${RELEASE_DIR}"

          # Upload standalone build
          tar czf /tmp/release.tar.gz -C .next/standalone .
          ${SCP_CMD} /tmp/release.tar.gz ${VPS_USER}@${VPS_HOST}:/tmp/release.tar.gz

          # Extract and link
          ${SSH_CMD} << 'ENDSSH'
            set -e
            RELEASE_DIR="$(ls -dt /var/www/maalalcars/releases/*/ | head -1 | sed 's:/$::')"

            # Extract release
            tar xzf /tmp/release.tar.gz -C ${RELEASE_DIR}
            rm /tmp/release.tar.gz

            # Symlink shared storage into release
            mkdir -p /var/www/maalalcars/shared/storage
            ln -sfn /var/www/maalalcars/shared/storage ${RELEASE_DIR}/storage
            ln -sfn /var/www/maalalcars/shared/storage ${RELEASE_DIR}/public/storage

            # Symlink shared database
            mkdir -p /var/www/maalalcars/shared/prisma
            ln -sfn /var/www/maalalcars/shared/prisma/production.db ${RELEASE_DIR}/prisma/dev.db

            # Initialize DB if it doesn't exist yet (first deploy)
            if [ ! -f /var/www/maalalcars/shared/prisma/production.db ]; then
              cd ${RELEASE_DIR}
              export DATABASE_URL="file:/var/www/maalalcars/shared/prisma/production.db"
              npx prisma db push --skip-generate --accept-data-loss
              echo "Database initialized via prisma db push"
            fi

            # Symlink .env.production
            if [ -f /var/www/maalalcars/shared/.env.production ]; then
              ln -sfn /var/www/maalalcars/shared/.env.production ${RELEASE_DIR}/.env.production
            fi

            # Switch current symlink to new release
            ln -sfn ${RELEASE_DIR} /var/www/maalalcars/current

            # Restart app via PM2
            cd /var/www/maalalcars/current
            pm2 delete maalalcars 2>/dev/null || true
            PORT=3000 NODE_ENV=production DATABASE_URL="file:/var/www/maalalcars/shared/prisma/production.db" pm2 start server.js --name maalalcars --cwd /var/www/maalalcars/current
            pm2 save

            # Keep only last 5 releases
            cd /var/www/maalalcars/releases
            ls -dt */ | tail -n +6 | xargs rm -rf 2>/dev/null || true

            echo "Deployment complete: ${RELEASE_DIR}"
          ENDSSH
